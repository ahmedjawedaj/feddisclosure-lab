name: flower-smoke
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/feddisclosure/training/**'
      - 'configs/training/**'
      - 'pyproject.toml'
      - 'scripts/run_flower_experiment.py'
      - 'scripts/verify_flower_parity.py'
      - 'scripts/run_torch_reference.py'
      - '.github/workflows/flower-smoke.yml'
jobs:
  flower:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install ML dependencies
        run: python -m pip install -e '.[ml,test]'
      - name: Generate deterministic approved public-digit partitions
        run: >-
          python scripts/prepare_fl_data.py --output data/training/digits-iid
          --clients 3 --seed 20261118 --limit 600 --partition iid
      - name: Execute actual Flower ServerApp and 3 ClientApps
        run: python scripts/run_flower_experiment.py
      - name: Execute matched independent-worker reference
        run: |
          python scripts/run_torch_reference.py \
            --config configs/training/fedavg_digits_iid.yaml \
            --data-dir data/training/digits-iid \
            --output reports/results/sprint2/flower/torch_parity_reference.json
      - name: Compare native Flower and independent-worker final weights
        run: |
          python scripts/verify_flower_parity.py \
            --flower-dir reports/results/sprint2/flower \
            --reference-json reports/results/sprint2/flower/torch_parity_reference.json \
            --reference-checkpoint reports/results/sprint2/flower/checkpoints/digits-iid-smoke-v1_final.pt \
            --manifest data/training/digits-iid/manifest.json \
            --output reports/results/sprint2/flower/flower_parity.json
      - name: Show measured result (no fabricated success)
        run: cat reports/results/sprint2/flower/flower_run.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: flower-smoke-evidence
          path: reports/results/sprint2/flower/
