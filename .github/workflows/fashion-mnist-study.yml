name: Fashion-MNIST ordering study (small CNN, row X1)

on:
  workflow_dispatch:
    inputs:
      seeds:
        description: 'Number of evaluation seeds (seeds 0 to N-1, at least 10)'
        required: false
        default: '30'
        type: string

permissions:
  contents: read

jobs:
  fashion-mnist:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      PYTHONPATH: src:.
      FMNIST_SEEDS: ${{ inputs.seeds }}
      FMNIST_OUT: reports/results/privacy/v0150/fashion_mnist/hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check the inputs
        run: |
          [[ "$FMNIST_SEEDS" =~ ^[0-9]+$ ]] && [ "$FMNIST_SEEDS" -ge 10 ] && [ "$FMNIST_SEEDS" -le 100 ]
      - name: Install dependencies (CPU only)
        run: |
          python -m pip install -e '.[test]'
          python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch==2.5.1'
          python -m pip install 'scikit-learn>=1.4,<2' 'numpy>=1.26,<3' 'scipy>=1.11,<2' 'scikit-image>=0.22,<1' 'flwr==1.27.0'
      - name: Static checks and unit tests
        run: |
          python scripts/check_workflows_static.py
          pytest -q tests/training/test_fashion_mnist.py tests/training/test_scaling_study.py
      - name: Download Fashion-MNIST and check the pinned SHA-256
        run: |
          python - <<'PY'
          from feddisclosure.training.fashion_mnist import fetch_fashion_mnist, files_verified, LOCAL_DIR
          fetch_fashion_mnist()
          assert files_verified(LOCAL_DIR)
          print("verified", sorted(p.name for p in LOCAL_DIR.iterdir()))
          PY
      - name: Tune the attack on tuning seeds 9000 and up
        timeout-minutes: 90
        run: python scripts/run_fashion_mnist_study.py --tune --workers "$(nproc)" --output "$FMNIST_OUT"
      - name: Evaluate on seeds 0 to N-1
        timeout-minutes: 60
        run: python scripts/run_fashion_mnist_study.py --seeds "$FMNIST_SEEDS" --workers "$(nproc)" --output "$FMNIST_OUT"
      - name: Show the verdict
        if: always()
        run: python -c "import json; print(json.dumps(json.load(open('$FMNIST_OUT/summary.json'))['X1'], indent=1))" || true
      - name: Retain results for audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fashion-mnist-evidence
          path: reports/results/privacy/v0150/fashion_mnist/hosted
          if-no-files-found: warn
