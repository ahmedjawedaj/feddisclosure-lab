name: history-controls-native
on:
  push:
  pull_request:
jobs:
  history-http:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test,research]'
      - run: python scripts/run_history_scope_benchmark.py --output reports/results/sprint1/ci_history_http.json
      - run: python scripts/run_history_matrix.py --output reports/results/sprint1/ci_history_matrix.json
      - run: python scripts/verify_history_matrix.py --input reports/results/sprint1/ci_history_matrix.json
      - run: bash scripts/verify_compose_history.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: principal-history-evidence
          path: |
            reports/results/sprint1/ci_history_http.json
            reports/results/sprint1/ci_history_matrix.json
            reports/results/sprint1/docker_principal_history.json
            reports/results/sprint1/docker_history_services.log
