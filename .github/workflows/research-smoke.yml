name: public-data-research-smoke
on:
  workflow_dispatch:
  push:
    paths:
      - 'src/feddisclosure/training/**'
      - 'src/feddisclosure/attacks/**'
      - 'src/feddisclosure/evaluation/**'
      - 'scripts/run_gradient_inversion.py'
      - 'scripts/run_membership_inference.py'
      - 'scripts/run_torch_reference.py'
      - '.github/workflows/research-smoke.yml'
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install research and test dependencies
        run: python -m pip install -e '.[research,test]'
      - name: Unit and privacy-boundary tests
        run: pytest -q -m 'not slow'
      - name: Recompute three-process FedAvg public-digit baseline
        run: >-
          python scripts/run_torch_reference.py
          --config configs/training/fedavg_digits_iid.yaml
          --data-dir data/training/ci-public-digits
          --output reports/results/ci/torch_fedavg.json
      - name: Run gradient inversion with explicit observer model
        run: >-
          python scripts/run_gradient_inversion.py
          --site-file data/training/ci-public-digits/institution-00/train.npz
          --output-dir reports/results/ci/gradient_inversion
          --batch-size 1 --seed 231 --steps 200
      - name: Run output-only membership inference
        run: >-
          python scripts/run_membership_inference.py
          --checkpoint reports/results/ci/checkpoints/digits-iid-smoke-v1_final.pt
          --data-dir data/training/ci-public-digits
          --output-dir reports/results/ci/membership
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-research-smoke-evidence
          path: reports/results/ci/
