name: release-gate
on:
  pull_request:
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Release gate against the pull request base
        run: python scripts/release_gate.py "${{ github.event.pull_request.base.sha }}"
