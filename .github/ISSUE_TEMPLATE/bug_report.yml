name: Bug report
description: Something in the code, a script or a saved result looks wrong
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did you run and what did you see?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Exact commands, config file, seed and topology (Docker or simulation).
      render: shell
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      description: OS, Python, Docker, Flower, torch, Opacus, OpenDP versions.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or evidence files
      render: text
