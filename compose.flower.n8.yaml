    security_opt: ["no-new-privileges:true"]

# Build-time only. Set FDL_BUILD_CA_BUNDLE to a PEM file when egress goes through a
# TLS-inspecting proxy; the default is an empty placeholder (no extra CA).
secrets:
  fdl_build_ca:
    file: ${FDL_BUILD_CA_BUNDLE:-./docker/flower/no-ca-bundle.pem}

networks:
  flower-lab:
