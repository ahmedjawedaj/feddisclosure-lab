      FDL_SITE_VAL_SHA256: ${FDL_SITE_0_VAL_SHA256:?prepare deployment first}
      FDL_CLIENT_ATTEST_DIR: /attestation
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    volumes:
      - type: bind
        source: ${FDL_SITE_0_PATH:?prepare deployment first}
        target: /site
        read_only: true
      - type: bind
        source: ${FDL_RUN_DIR:?prepare deployment first}/clients/site-0
        target: /attestation
    depends_on: [supernode-0]
