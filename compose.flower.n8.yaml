# GENERATED by scripts/gen_compose_clients.py for 8 institutions. Do not edit by hand.
# Native Flower 1.27 Deployment Runtime, not the local simulation backend.
# Three different read-only host dataset mounts; only /attestation is writable.
# Research sandbox only: insecure internal transport; never expose on the Internet.
name: feddisclosure-flower
x-site-exec: &site-exec
  build:
    context: .
    dockerfile: docker/flower/SuperExec.Dockerfile
    secrets: [fdl_build_ca]
  image: feddisclosure-flower-exec:0.12.0
  entrypoint: ["flower-superexec"]
  networks: [flower-lab]
  restart: "no"
  environment:
    FDL_SITE_DATA_DIR: /site
    FDL_CLIENT_ATTEST_DIR: /attestation
    OMP_NUM_THREADS: "1"
    MKL_NUM_THREADS: "1"
  # Python needs writable workspace for received Flower applications. Each
  # executor has its OWN ephemeral filesystem and no shared writable mount.
  security_opt: ["no-new-privileges:true"]
  tmpfs: [/tmp]

x-supernode: &supernode
  image: flwr/supernode:1.27.0
  networks: [flower-lab]
  restart: "no"
  depends_on: [superlink]
  security_opt: ["no-new-privileges:true"]

services:
  superlink:
    image: flwr/superlink:1.27.0
    command: ["--insecure", "--isolation", "process"]
    networks: [flower-lab]
    restart: "no"
    # NO host-exposed ports: CLI executes inside the isolated Docker network.
    security_opt: ["no-new-privileges:true"]

  serverexec:
    build:
      context: .
      dockerfile: docker/flower/SuperExec.Dockerfile
      secrets: [fdl_build_ca]
    image: feddisclosure-flower-exec:0.12.0
    entrypoint: ["flower-superexec"]
    command: ["--insecure", "--plugin-type", "serverapp", "--appio-api-address", "superlink:9091"]
    environment:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    volumes:
      - type: bind
        source: ${FDL_RUN_DIR:?Run scripts/prepare_flower_deployment.py first}/server
        target: /artifacts
    networks: [flower-lab]
    depends_on: [superlink]
    security_opt: ["no-new-privileges:true"]
    restart: "no"

  supernode-0:
    <<: *supernode
    command: ["--insecure", "--superlink", "superlink:9092", "--clientappio-api-address", "0.0.0.0:9094", "--node-config", "partition-id=0 num-partitions=8", "--isolation", "process"]
  supernode-1:
    <<: *supernode
    command: ["--insecure", "--superlink", "superlink:9092", "--clientappio-api-address", "0.0.0.0:9094", "--node-config", "partition-id=1 num-partitions=8", "--isolation", "process"]
