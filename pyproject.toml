[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "feddisclosure-lab"
version = "0.16.2"
description = "Reproducible federated learning disclosure laboratory: Flower in Docker, SecAgg+, Opacus DP, OpenDP, membership inference and update inversion"
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "Ahmed Jawed"}]
keywords = ["federated-learning", "differential-privacy", "secure-aggregation", "membership-inference", "gradient-inversion", "flower", "opacus", "opendp", "reproducible-research"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Security",
]
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.110,<1",
  "uvicorn>=0.29,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.6,<3",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-cov>=5,<8", "hypothesis>=6.100,<7"]
research = ["torch>=2.3,<3", "torchvision>=0.18,<1", "scikit-learn>=1.4,<2", "scipy>=1.11,<2", "scikit-image>=0.22,<1", "matplotlib>=3.8,<4"]
ml = ["torch>=2.3,<3", "torchvision>=0.18,<1", "scikit-learn>=1.4,<2", "scipy>=1.11,<2", "scikit-image>=0.22,<1", "flwr[simulation]>=1.27,<1.28"]
privacy = ["opendp>=0.12,<1", "opacus>=1.4,<2"]
visual = ["streamlit>=1.39,<2", "pandas>=2.2,<3", "matplotlib>=3.8,<4"]
presentation = ["python-pptx>=1.0,<2", "Pillow>=10,<13"]

[project.urls]
Homepage = "https://github.com/ahmedjawedaj/feddisclosure-lab"
Issues = "https://github.com/ahmedjawedaj/feddisclosure-lab/issues"
Changelog = "https://github.com/ahmedjawedaj/feddisclosure-lab/blob/main/CHANGELOG.md"

[project.scripts]
fdl = "feddisclosure.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra"
markers = ["slow: subprocess-based PyTorch training smoke tests"]

[tool.coverage.run]
source = ["src/feddisclosure", "services"]

[tool.flwr.app]
publisher = "feddisclosure"

[tool.flwr.app.components]
serverapp = "feddisclosure.training.flower_server:app"
clientapp = "feddisclosure.training.flower_client:app"

[tool.flwr.app.config]
num-server-rounds = 2
local-epochs = 1
batch-size = 32
learning-rate = 0.15
proximal-mu = 0.0
clients = 3
seed = 20261118
features = 64
classes = 10
data-root = "data/training/digits-iid"
artifact-dir = "reports/results/sprint2/flower"
aggregation = "upstream"

# The three-supernode simulation connection is written to `~/.flwr/config.toml` by
# `feddisclosure.training.flwr_cli.ensure_simulation_connection`. A legacy
# `[tool.flwr.federations]` table here makes Flower rewrite this file on first use.

