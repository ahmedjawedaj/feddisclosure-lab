[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "feddisclosure-lab"
version = "0.2.0"
description = "Reproducible federated analytics disclosure and privacy evaluation laboratory"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.110,<1",
  "uvicorn>=0.29,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.6,<3",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-cov>=5,<8"]
ml = ["torch>=2.3,<3", "torchvision>=0.18,<1", "flwr>=1.20,<2"]
privacy = ["opendp>=0.12,<1", "opacus>=1.4,<2"]
visual = ["streamlit>=1.39,<2", "pandas>=2.2,<3", "matplotlib>=3.8,<4"]

[project.scripts]
fdl = "feddisclosure.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra"

[tool.coverage.run]
source = ["src/feddisclosure", "services"]
