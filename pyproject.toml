[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "feddisclosure-lab"
version = "0.5.0"
description = "Reproducible federated analytics disclosure and privacy evaluation laboratory"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.110,<1",
  "uvicorn>=0.29,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.6,<3",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-cov>=5,<8"]
research = ["torch>=2.3,<3", "torchvision>=0.18,<1", "scikit-learn>=1.4,<2", "scipy>=1.11,<2", "scikit-image>=0.22,<1", "matplotlib>=3.8,<4"]
ml = ["torch>=2.3,<3", "torchvision>=0.18,<1", "scikit-learn>=1.4,<2", "scipy>=1.11,<2", "scikit-image>=0.22,<1", "flwr[simulation]>=1.27,<1.28"]
privacy = ["opendp>=0.12,<1", "opacus>=1.4,<2"]
visual = ["streamlit>=1.39,<2", "pandas>=2.2,<3", "matplotlib>=3.8,<4"]

[project.scripts]
fdl = "feddisclosure.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-ra"
markers = ["slow: subprocess-based PyTorch training smoke tests"]

[tool.coverage.run]
source = ["src/feddisclosure", "services"]

[tool.flwr.app]
publisher = "feddisclosure"

[tool.flwr.app.components]
serverapp = "feddisclosure.training.flower_server:app"
clientapp = "feddisclosure.training.flower_client:app"

[tool.flwr.app.config]
num-server-rounds = 2
local-epochs = 1
batch-size = 32
learning-rate = 0.15
proximal-mu = 0.0
clients = 3
seed = 20261118
features = 64
classes = 10
data-root = "data/training/digits-iid"
artifact-dir = "reports/results/sprint2/flower"

[tool.flwr.federations]
default = "local-simulation"

[tool.flwr.federations.local-simulation]
options.num-supernodes = 3

